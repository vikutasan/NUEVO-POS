name: CI — Nuevo POS (F0)

# Pipeline de CI de la FASE 0 (Andamiaje) + cierre de riesgos estructurales.
# Corre en cada push y en cada pull request.
#
# Puertas:
#   - puerta-f0: lint + test (Node/Vitest) + guards + guards:coverage + parity
#   - puerta-api: pytest contra un Postgres real (R4 — cierra el hueco de que
#     los tests de API NUNCA corrían en CI porque `test.mjs` los OMITE si el
#     contenedor `api` no está arriba, y en el runner no hay Docker levantado).

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  puerta-f0:
    name: Puerta F0 (lint + test + guards + parity)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Guardianes de estándares (8 greps)
        run: npm run guards

      - name: Meta-guard de cobertura de guards (R1)
        run: npm run guards:coverage

      - name: Guard de paridad de operación (§10.6)
        run: npm run parity

  puerta-api:
    name: Puerta API (pytest contra Postgres real)
    runs-on: ubuntu-latest

    # R4 — servicio Postgres real para que los tests de la API corran de verdad.
    # Antes, `test.mjs` reportaba OMITIDO (no verde) si el contenedor `api` no
    # estaba arriba; en el runner no hay Docker, así que la API nunca se probaba.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: pos
          POSTGRES_PASSWORD: pos
          POSTGRES_DB: nuevo_pos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pos -d nuevo_pos"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://pos:pos@localhost:5432/nuevo_pos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias de la API
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Migraciones (alembic upgrade head)
        working-directory: apps/api
        run: alembic upgrade head

      - name: Tests de la API (pytest)
        working-directory: apps/api
        run: pytest -q
