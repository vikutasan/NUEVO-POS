name: CI — Nuevo POS (F0)

# Pipeline de CI de la FASE 0 (Andamiaje).
# Corre en cada push y en cada pull request.
# Puerta de F0: lint + test + guards (los 5 greps de estándares) en verde.

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  puerta-f0:
    name: Puerta F0 (lint + test + guards)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Guardianes de estándares (5 greps)
        run: npm run guards

      - name: Guard de paridad de operación (§10.6)
        run: npm run parity
